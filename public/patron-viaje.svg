<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="400" viewBox="0 0 400 400">
  <!--
    Patrón de viaje estilo "dibujo de línea", desordenado a propósito.
    1) En <defs> se dibuja cada figura UNA vez, centrada en (0,0).
    2) Abajo se reutiliza con <use>, cambiando posición, giro (rotate)
       y tamaño (scale) para que nada quede alineado.
    Color: #062f22, un verde un poco más oscuro que el verde bosque.
  -->
  <defs>
    <g id="pasaporte">
      <rect x="-27" y="-36" width="54" height="72" rx="6"/>
      <circle cx="0" cy="-6" r="12"/>
      <ellipse cx="0" cy="-6" rx="5" ry="12"/>
      <path d="M-12 -6 H12"/>
      <path d="M-13 20 H13"/>
      <path d="M-9 27 H9"/>
    </g>
    <g id="maleta">
      <path d="M-8 -26 V-33 Q-8 -36 -5 -36 H5 Q8 -36 8 -33 V-26"/>
      <rect x="-23" y="-26" width="46" height="58" rx="7"/>
      <path d="M-11 -18 V24"/>
      <path d="M0 -18 V24"/>
      <path d="M11 -18 V24"/>
      <circle cx="-13" cy="36" r="3"/>
      <circle cx="13" cy="36" r="3"/>
    </g>
    <g id="globo">
      <circle r="28"/>
      <ellipse rx="12" ry="28"/>
      <path d="M-28 0 H28"/>
      <path d="M-23 -14 H23"/>
      <path d="M-23 14 H23"/>
    </g>
    <g id="avion">
      <g transform="scale(2.4) translate(-12 -12)" stroke-width="0.85">
        <path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
      </g>
    </g>
    <g id="brujula">
      <circle r="30"/>
      <circle r="23"/>
      <path d="M0 -21 L5 0 L0 21 L-5 0 Z"/>
      <path d="M-21 0 L0 -4 L21 0 L0 4 Z"/>
      <circle r="2.5"/>
    </g>
    <g id="palmera">
      <g transform="translate(-30 -40)">
        <path d="M30 80 Q36 50 30 20"/>
        <path d="M30 20 Q15 8 0 18 Q14 14 30 20"/>
        <path d="M30 20 Q45 8 60 18 Q46 14 30 20"/>
        <path d="M30 20 Q24 2 10 -2 Q24 8 30 20"/>
        <path d="M30 20 Q36 2 50 -2 Q36 8 30 20"/>
        <path d="M8 82 Q30 75 54 82"/>
      </g>
    </g>
    <g id="senal">
      <g transform="translate(-20 -40)">
        <path d="M20 0 V80"/>
        <path d="M0 10 H40 L48 18 L40 26 H0 Z"/>
        <path d="M40 34 H0 L-8 42 L0 50 H40 Z"/>
        <path d="M8 80 H32"/>
      </g>
    </g>
    <g id="camara">
      <g transform="translate(-28 -23)">
        <path d="M18 8 L22 0 H34 L38 8"/>
        <rect x="0" y="8" width="56" height="38" rx="6"/>
        <circle cx="28" cy="27" r="11"/>
        <circle cx="28" cy="27" r="5"/>
        <path d="M44 15 H49"/>
      </g>
    </g>
    <g id="hoja">
      <path d="M-15 10 Q-5 -10 15 -10 Q5 10 -15 10 Z"/>
      <path d="M-15 10 L5 -2"/>
    </g>
    <g id="estrella">
      <path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z"/>
    </g>
  </defs>

  <g fill="none" stroke="#062f22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Figuras grandes: cada una con posición, giro y tamaño distintos -->
    <use href="#pasaporte" xlink:href="#pasaporte" transform="translate(70 62) rotate(-25) scale(0.9)"/>
    <use href="#maleta" xlink:href="#maleta" transform="translate(205 78) rotate(18) scale(0.85)"/>
    <use href="#globo" xlink:href="#globo" transform="translate(338 92) rotate(-14) scale(0.72)"/>
    <use href="#avion" xlink:href="#avion" transform="translate(128 172) rotate(-52)"/>
    <use href="#brujula" xlink:href="#brujula" transform="translate(302 212) rotate(15) scale(0.8)"/>
    <use href="#palmera" xlink:href="#palmera" transform="translate(62 298) rotate(-12) scale(0.9)"/>
    <use href="#senal" xlink:href="#senal" transform="translate(218 318) rotate(11) scale(0.8)"/>
    <use href="#camara" xlink:href="#camara" transform="translate(338 340) rotate(-28) scale(0.8)"/>

    <!-- Figuras pequeñas para romper el orden -->
    <use href="#avion" xlink:href="#avion" transform="translate(48 182) rotate(28) scale(0.6)"/>
    <use href="#maleta" xlink:href="#maleta" transform="translate(132 352) rotate(-35) scale(0.6)"/>
    <use href="#pasaporte" xlink:href="#pasaporte" transform="translate(246 252) rotate(32) scale(0.6)"/>
    <use href="#hoja" xlink:href="#hoja" transform="translate(152 262) rotate(40)"/>
    <use href="#hoja" xlink:href="#hoja" transform="translate(272 140) rotate(-70) scale(0.8)"/>
    <use href="#hoja" xlink:href="#hoja" transform="translate(372 22) rotate(120) scale(0.7)"/>

    <!-- Estela de avión -->
    <path d="M160 140 q20 -24 46 -16" stroke-dasharray="4 8"/>

    <!-- Estrellas y puntos sueltos -->
    <use href="#estrella" xlink:href="#estrella" transform="translate(175 32) rotate(20)"/>
    <use href="#estrella" xlink:href="#estrella" transform="translate(192 214) rotate(-15) scale(0.8)"/>
    <use href="#estrella" xlink:href="#estrella" transform="translate(28 118) rotate(10) scale(1.2)"/>
    <use href="#estrella" xlink:href="#estrella" transform="translate(380 282) rotate(35)"/>
    <use href="#estrella" xlink:href="#estrella" transform="translate(108 108) scale(0.7)"/>
    <circle cx="258" cy="30" r="2"/>
    <circle cx="96" cy="236" r="2"/>
    <circle cx="372" cy="160" r="2"/>
    <circle cx="20" cy="380" r="2"/>
    <circle cx="280" cy="380" r="2"/>
  </g>
</svg>
